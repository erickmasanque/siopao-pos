<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Siopao POS — Admin</title>
  <style>
    /* Reuse the seller-frontend palette as the de-facto Touchstone. */
    :root {
      --bg:        #fff8f0;
      --surface:   #ffffff;
      --surface-2: #fdf2e3;
      --primary:   #c44b2f;
      --primary-d: #9c3a23;
      --accent:    #2f7d3c;
      --warn:      #b88500;
      --danger:    #b3261e;
      --text:      #221a14;
      --muted:     #7a6a5e;
      --border:    #ead9c5;
      --shadow:    0 1px 3px rgba(80, 40, 10, 0.08);
      --radius:    10px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      font-size: 14px;
      line-height: 1.4;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input, select, textarea {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 6px;
      color: var(--text);
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; }

    [hidden] { display: none !important; }

    /* ---------- Loading / auth gate ---------- */
    .loading {
      display: flex; align-items: center; justify-content: center;
      min-height: 60vh; color: var(--muted); font-size: 16px;
    }
    .auth-gate {
      max-width: 480px; margin: 80px auto; text-align: center;
      background: var(--surface); padding: 32px 24px;
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .auth-gate h1 { margin: 0 0 12px; color: var(--primary); font-size: 24px; }
    .auth-gate p  { margin: 8px 0; }
    .auth-gate .email { font-weight: 600; }
    .auth-gate .hint  { color: var(--muted); font-size: 13px; margin-top: 16px; }

    /* ---------- Topbar + nav ---------- */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .brand { font-weight: 700; color: var(--primary); font-size: 16px; }
    .who { color: var(--muted); font-size: 13px; }

    .tabs {
      display: flex; gap: 4px; padding: 0 12px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tabs button {
      padding: 12px 14px; font-weight: 500;
      color: var(--muted); border-bottom: 3px solid transparent;
      white-space: nowrap;
    }
    .tabs button.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .tabs button:hover:not(.active) { color: var(--text); }

    /* ---------- Content area ---------- */
    .content { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .view-stub {
      background: var(--surface); padding: 32px;
      border-radius: var(--radius); box-shadow: var(--shadow);
      color: var(--muted); text-align: center;
    }
    .view-stub h2 { color: var(--text); margin: 0 0 8px; }

    h2.section-title {
      margin: 0 0 12px; font-size: 18px;
    }

    /* ---------- Cards / tables (used by later heats) ---------- */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
    }
    table {
      width: 100%; border-collapse: collapse; background: var(--surface);
      border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow);
    }
    th, td {
      padding: 10px 12px; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: var(--surface-2);
      font-weight: 600; color: var(--muted);
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px;
    }
    tr:last-child td { border-bottom: none; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 14px; border-radius: 6px; font-weight: 600;
      background: var(--primary); color: white;
    }
    .btn:hover:not(:disabled) { background: var(--primary-d); }
    .btn.secondary {
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.danger { background: var(--danger); }
    .btn.small { padding: 6px 10px; font-size: 13px; }

    /* ---------- Modal (used by later heats) ---------- */
    .modal {
      position: fixed; inset: 0;
      background: rgba(20,10,5,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-card {
      background: var(--bg);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%; max-width: 420px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .modal-card h3 { margin: 0 0 12px; }
    .modal-card .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .modal-card .row label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

    /* ---------- Dashboard ---------- */
    .dash-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .dash-head .day { color: var(--muted); font-size: 13px; }
    .dash-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    @media (max-width: 720px) { .dash-grid { grid-template-columns: 1fr; } }
    .stat-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
    .stat-card h3 {
      margin: 0 0 8px; font-size: 12px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .stat-big { font-size: 30px; font-weight: 700; color: var(--primary); }
    .stat-row {
      display: flex; justify-content: space-between; padding: 6px 0;
      font-size: 14px;
    }
    .stat-row + .stat-row { border-top: 1px dashed var(--border); }
    .stat-row .label { color: var(--muted); }
    .stat-row .val { font-weight: 600; }
    .stat-store-block + .stat-store-block { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .stat-store-name {
      font-weight: 700; color: var(--text); margin-bottom: 6px; font-size: 14px;
    }

    .list-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
    .list-card h3 {
      margin: 0 0 12px; font-size: 14px; font-weight: 700;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .list-card h3 small { font-weight: 400; color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); font-style: italic; padding: 12px 0; }

    .row-line {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; gap: 8px;
    }
    .row-line + .row-line { border-top: 1px dashed var(--border); }
    .row-line .main { flex: 1; min-width: 0; }
    .row-line .sub { color: var(--muted); font-size: 12px; }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 700; text-transform: uppercase;
    }
    .badge.warn { background: #fff3cd; color: var(--warn); }
    .badge.danger { background: #fde0de; color: var(--danger); }
    .badge.ok { background: #e0f0e2; color: var(--accent); }

    /* ---------- Toolbars used by data views ---------- */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .toolbar .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .toolbar .controls label { color: var(--muted); font-size: 13px; }
    .toolbar .controls select, .toolbar .controls input {
      min-width: 140px;
    }

    .stock-cell { font-weight: 700; }
    .stock-cell.low { color: var(--warn); }
    .stock-cell.out { color: var(--danger); }
    .row-inactive { opacity: 0.55; }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: var(--text); color: white;
      padding: 10px 18px; border-radius: 999px; font-size: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      z-index: 200;
    }
    .toast.err { background: var(--danger); }
    .toast.ok  { background: var(--accent); }
  </style>
</head>
<body>

  <div id="loading" class="loading">Loading…</div>

  <div id="auth-gate" class="auth-gate" hidden>
    <h1>Siopao POS — Admin</h1>
    <p id="auth-msg">Not authorized.</p>
    <p class="hint">Open this page in a browser tab signed in to the Google account that owns this Apps Script project, and ensure that email is listed in <code>ADMIN_EMAILS</code> under Script Properties.</p>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">Siopao POS — Admin</div>
      <div class="who"><span id="who-email"></span></div>
    </header>

    <nav class="tabs">
      <button data-view="dashboard">Dashboard</button>
      <button data-view="inventory">Inventory</button>
      <button data-view="menu">Menu &amp; Prices</button>
      <button data-view="sellers">Sellers</button>
      <button data-view="sales">Sales Log</button>
      <button data-view="shifts">Shift History</button>
    </nav>

    <main id="content" class="content"></main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script>
    'use strict';

    // ---------- google.script.run promise wrapper ----------
    function srv(name) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (err) {
            reject(new Error((err && err.message) || String(err)));
          });
        runner[name].apply(runner, args);
      });
    }

    // ---------- Tiny helpers ----------
    function $(sel) { return document.querySelector(sel); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
      });
    }
    function fmtPeso(n, decimals) {
      if (decimals == null) decimals = 2;
      return '₱' + (Number(n) || 0).toFixed(decimals);
    }
    function toast(msg, kind) {
      var t = $('#toast');
      t.textContent = msg;
      t.className = 'toast' + (kind ? ' ' + kind : '');
      t.hidden = false;
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { t.hidden = true; }, 2800);
    }

    // ---------- State ----------
    var state = {
      view: null,
      menu: null,        // { stores, items, bundles }
      sellers: null,
      stores: null
    };

    // ---------- View router ----------
    var VIEWS = {
      dashboard: { title: 'Dashboard',     render: renderDashboard },
      inventory: { title: 'Inventory',     render: renderInventory },
      menu:      { title: 'Menu & Prices', render: renderMenu },
      sellers:   { title: 'Sellers',       render: renderSellers },
      sales:     { title: 'Sales Log',     render: renderStub },
      shifts:    { title: 'Shift History', render: renderStub }
    };

    function showView(name) {
      var view = VIEWS[name];
      if (!view) return;
      state.view = name;
      document.querySelectorAll('.tabs button').forEach(function (b) {
        b.classList.toggle('active', b.dataset.view === name);
      });
      view.render(name);
    }

    function renderStub(name) {
      var v = VIEWS[name];
      $('#content').innerHTML =
        '<div class="view-stub">' +
        '  <h2>' + esc(v.title) + '</h2>' +
        '  <p>This view lands in a later heat. Auth + shell ready.</p>' +
        '</div>';
    }

    // ---------- Dashboard ----------
    async function renderDashboard() {
      $('#content').innerHTML =
        '<div class="dash-head">' +
        '  <h2 class="section-title">Today</h2>' +
        '  <button class="btn small secondary" id="dash-refresh">Refresh</button>' +
        '</div>' +
        '<div id="dash-body"><div class="empty">Loading…</div></div>';

      $('#dash-refresh').addEventListener('click', loadDashboard);
      await loadDashboard();
    }

    async function loadDashboard() {
      try {
        var data = await srv('ui_getDashboard');
        if (state.view !== 'dashboard') return; // tab switched mid-load
        $('#dash-body').innerHTML = buildDashboardHtml(data);
        wireDashboardActions();
      } catch (err) {
        $('#dash-body').innerHTML =
          '<div class="empty">Failed to load: ' + esc(err.message || err) + '</div>';
      }
    }

    function buildDashboardHtml(d) {
      var t = d.today || { by_store: {}, total: { cash: 0, gcash: 0, count: 0 } };
      var total = t.total || { cash: 0, gcash: 0, count: 0 };
      var revenue = (Number(total.cash) || 0) + (Number(total.gcash) || 0);

      var perStoreHtml = '';
      var storeKeys = Object.keys(t.by_store || {});
      if (storeKeys.length === 0) {
        perStoreHtml = '<div class="empty">No sales recorded today yet.</div>';
      } else {
        // Map store_id → display name via active_shifts / variance_alerts if any,
        // else fall back to the store_id itself.
        var storeNameLookup = {};
        (d.active_shifts || []).forEach(function (s) { storeNameLookup[s.store_id] = s.store_name; });
        (d.variance_alerts || []).forEach(function (s) { storeNameLookup[s.store_id] = s.store_name; });

        perStoreHtml = storeKeys.map(function (sid) {
          var row = t.by_store[sid];
          var name = storeNameLookup[sid] || sid;
          return (
            '<div class="stat-store-block">' +
            '  <div class="stat-store-name">' + esc(name) + '</div>' +
            '  <div class="stat-row"><span class="label">Cash</span><span class="val">' + fmtPeso(row.cash) + '</span></div>' +
            '  <div class="stat-row"><span class="label">GCash</span><span class="val">' + fmtPeso(row.gcash) + '</span></div>' +
            '  <div class="stat-row"><span class="label">Sales</span><span class="val">' + (row.count || 0) + '</span></div>' +
            '</div>'
          );
        }).join('');
      }

      var bestHtml = (!d.best_sellers || d.best_sellers.length === 0)
        ? '<div class="empty">Nothing sold today yet.</div>'
        : d.best_sellers.slice(0, 10).map(function (b) {
            return (
              '<div class="row-line">' +
              '  <div class="main">' + esc(b.name) + '</div>' +
              '  <div class="val">×' + b.qty_sold + '</div>' +
              '</div>'
            );
          }).join('');

      var activeHtml = (!d.active_shifts || d.active_shifts.length === 0)
        ? '<div class="empty">No active shifts right now.</div>'
        : d.active_shifts.map(function (s) {
            return (
              '<div class="row-line">' +
              '  <div class="main">' +
              '    <div>' + esc(s.seller_name) + ' <span class="sub">@ ' + esc(s.store_name) + '</span></div>' +
              '    <div class="sub">since ' + fmtTime(s.start_time) + ' · running ' + runningDuration(s.start_time) + '</div>' +
              '  </div>' +
              '  <button class="btn small secondary" data-action="force-close" data-shift-id="' + esc(s.shift_id) + '" data-seller="' + esc(s.seller_name) + '">Force close</button>' +
              '</div>'
            );
          }).join('');

      var alertsHtml = (!d.variance_alerts || d.variance_alerts.length === 0)
        ? '<div class="empty">No variance alerts today (threshold ₱20).</div>'
        : d.variance_alerts.map(function (a) {
            var bits = [];
            if (Math.abs(a.variance_cash)  > 0.005) bits.push('Cash ' + signed(a.variance_cash));
            if (Math.abs(a.variance_gcash) > 0.005) bits.push('GCash ' + signed(a.variance_gcash));
            return (
              '<div class="row-line">' +
              '  <div class="main">' +
              '    <div>' + esc(a.seller_name) + ' <span class="sub">@ ' + esc(a.store_name) + '</span></div>' +
              '    <div class="sub">closed ' + fmtTime(a.end_time) + '</div>' +
              '  </div>' +
              '  <span class="badge danger">' + bits.join(' · ') + '</span>' +
              '</div>'
            );
          }).join('');

      return (
        '<div class="dash-grid">' +
        '  <div class="stat-card">' +
        '    <h3>Revenue today</h3>' +
        '    <div class="stat-big">' + fmtPeso(revenue) + '</div>' +
        '    <div class="stat-row"><span class="label">Cash</span><span class="val">' + fmtPeso(total.cash) + '</span></div>' +
        '    <div class="stat-row"><span class="label">GCash</span><span class="val">' + fmtPeso(total.gcash) + '</span></div>' +
        '    <div class="stat-row"><span class="label">Sales</span><span class="val">' + (total.count || 0) + '</span></div>' +
        '  </div>' +
        '  <div class="stat-card">' +
        '    <h3>By store</h3>' +
        '    ' + perStoreHtml +
        '  </div>' +
        '  <div class="list-card">' +
        '    <h3>Best sellers <small>today</small></h3>' +
        '    ' + bestHtml +
        '  </div>' +
        '  <div class="list-card">' +
        '    <h3>Active shifts</h3>' +
        '    ' + activeHtml +
        '  </div>' +
        '  <div class="list-card" style="grid-column: 1 / -1;">' +
        '    <h3>Variance alerts <small>today, &gt; ₱20</small></h3>' +
        '    ' + alertsHtml +
        '  </div>' +
        '</div>'
      );
    }

    function wireDashboardActions() {
      document.querySelectorAll('[data-action="force-close"]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          var shiftId = btn.dataset.shiftId;
          var who = btn.dataset.seller;
          var ok = confirm('Force-close ' + who + "'s shift?\n\nNo counted cash/GCash will be recorded — variance fields will be blank. The shift's notes will be stamped [FORCE CLOSED BY ADMIN].");
          if (!ok) return;
          btn.disabled = true;
          try {
            await srv('ui_forceCloseShift', { shift_id: shiftId });
            toast('Shift force-closed', 'ok');
            await loadDashboard();
          } catch (err) {
            toast(err.message, 'err');
            btn.disabled = false;
          }
        });
      });
    }

    // ---------- Date/duration formatters ----------
    function fmtTime(t) {
      if (!t) return '—';
      var d = new Date(t);
      var h = d.getHours();
      var m = d.getMinutes();
      var ampm = h >= 12 ? 'PM' : 'AM';
      var hh = ((h + 11) % 12) + 1;
      return hh + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
    }
    function runningDuration(t) {
      if (!t) return '—';
      var ms = Date.now() - new Date(t).getTime();
      if (ms < 0) return '—';
      var m = Math.floor(ms / 60000);
      if (m < 60) return m + 'm';
      return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
    }
    function signed(n) {
      var v = Number(n) || 0;
      return (v > 0 ? '+' : '') + fmtPeso(v);
    }

    function fmtDate(t) {
      if (!t) return 'never';
      var d = new Date(t);
      var now = new Date();
      var sameDay = d.toDateString() === now.toDateString();
      if (sameDay) return 'today ' + fmtTime(t);
      var diffDays = Math.floor((now - d) / 86400000);
      if (diffDays === 1) return 'yesterday';
      if (diffDays < 7) return diffDays + 'd ago';
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }
    function pad2(n) { return (n < 10 ? '0' : '') + n; }

    // ---------- Inventory ----------
    var inventoryState = { store_id: null, rows: [] };

    async function renderInventory() {
      $('#content').innerHTML =
        '<div class="toolbar">' +
        '  <h2 class="section-title">Inventory</h2>' +
        '  <div class="controls">' +
        '    <label for="inv-store">Store</label>' +
        '    <select id="inv-store"></select>' +
        '    <button class="btn small secondary" id="inv-refresh">Refresh</button>' +
        '  </div>' +
        '</div>' +
        '<div id="inv-body"><div class="empty">Loading…</div></div>';

      // Load stores once, then default to first
      if (!state.stores) {
        try { state.stores = await srv('ui_listStores'); }
        catch (err) { $('#inv-body').innerHTML = '<div class="empty">Failed to load stores: ' + esc(err.message) + '</div>'; return; }
      }
      var sel = $('#inv-store');
      sel.innerHTML = state.stores
        .filter(function (s) { return s.active; })
        .map(function (s) { return '<option value="' + esc(s.store_id) + '">' + esc(s.name) + '</option>'; })
        .join('');
      if (!inventoryState.store_id) inventoryState.store_id = sel.value;
      else sel.value = inventoryState.store_id;

      sel.addEventListener('change', function () {
        inventoryState.store_id = sel.value;
        loadInventory();
      });
      $('#inv-refresh').addEventListener('click', loadInventory);

      await loadInventory();
    }

    async function loadInventory() {
      var sid = inventoryState.store_id;
      if (!sid) return;
      $('#inv-body').innerHTML = '<div class="empty">Loading…</div>';
      try {
        inventoryState.rows = await srv('ui_getInventoryDetail', { store_id: sid });
        if (state.view !== 'inventory') return;
        renderInventoryTable();
      } catch (err) {
        $('#inv-body').innerHTML = '<div class="empty">Failed: ' + esc(err.message) + '</div>';
      }
    }

    function renderInventoryTable() {
      var rows = inventoryState.rows.slice().sort(function (a, b) {
        // active first, then by name
        if (a.active !== b.active) return a.active ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      if (rows.length === 0) {
        $('#inv-body').innerHTML = '<div class="empty">No items in inventory for this store.</div>';
        return;
      }
      $('#inv-body').innerHTML =
        '<table>' +
        '  <thead><tr><th>Item</th><th>Stock</th><th>Last restocked</th><th></th></tr></thead>' +
        '  <tbody>' +
          rows.map(function (r) {
            var stockClass = r.stock <= 0 ? 'out' : r.stock <= 5 ? 'low' : '';
            return (
              '<tr class="' + (r.active ? '' : 'row-inactive') + '">' +
              '  <td>' + esc(r.name) + (r.active ? '' : ' <span class="badge warn">inactive</span>') + '</td>' +
              '  <td class="stock-cell ' + stockClass + '">' + r.stock + '</td>' +
              '  <td>' + esc(fmtDate(r.last_restocked_at)) +
                  (r.last_restocked_qty ? ' <span class="sub">(+' + r.last_restocked_qty + ')</span>' : '') +
              '  </td>' +
              '  <td><button class="btn small" data-action="restock" data-item-id="' + esc(r.item_id) + '" data-item-name="' + esc(r.name) + '">+ Restock</button></td>' +
              '</tr>'
            );
          }).join('') +
        '  </tbody>' +
        '</table>';

      document.querySelectorAll('[data-action="restock"]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          openRestockModal(btn.dataset.itemId, btn.dataset.itemName);
        });
      });
    }

    function openRestockModal(item_id, item_name) {
      var storeName = (state.stores || []).filter(function (s) { return s.store_id === inventoryState.store_id; })[0];
      storeName = storeName ? storeName.name : inventoryState.store_id;
      var modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML =
        '<div class="modal-card">' +
        '  <h3>Restock</h3>' +
        '  <div class="row"><label>Item</label><div>' + esc(item_name) + ' <span class="sub">@ ' + esc(storeName) + '</span></div></div>' +
        '  <div class="row"><label>Quantity to add</label><input type="number" id="restock-qty" min="1" step="1" value="10" autofocus></div>' +
        '  <div class="row"><label>Notes (optional)</label><input type="text" id="restock-notes" placeholder="e.g. fresh batch from kitchen"></div>' +
        '  <div class="modal-actions">' +
        '    <button class="btn secondary" data-modal-cancel>Cancel</button>' +
        '    <button class="btn" data-modal-ok>Add stock</button>' +
        '  </div>' +
        '</div>';
      document.body.appendChild(modal);
      modal.querySelector('[data-modal-cancel]').addEventListener('click', function () { modal.remove(); });
      modal.querySelector('[data-modal-ok]').addEventListener('click', async function () {
        var ok = modal.querySelector('[data-modal-ok]');
        var qty = Number(modal.querySelector('#restock-qty').value);
        var notes = modal.querySelector('#restock-notes').value;
        if (!isFinite(qty) || qty <= 0) { toast('Quantity must be positive', 'err'); return; }
        ok.disabled = true;
        try {
          await srv('ui_restock', { store_id: inventoryState.store_id, item_id: item_id, qty: qty, notes: notes });
          modal.remove();
          toast('Restocked +' + qty + ' ' + item_name, 'ok');
          await loadInventory();
        } catch (err) {
          toast(err.message, 'err');
          ok.disabled = false;
        }
      });
      setTimeout(function () { modal.querySelector('#restock-qty').focus(); modal.querySelector('#restock-qty').select(); }, 0);
    }

    // ---------- Menu & Prices ----------
    async function renderMenu() {
      $('#content').innerHTML =
        '<div class="toolbar">' +
        '  <h2 class="section-title">Menu &amp; Prices</h2>' +
        '  <div class="controls">' +
        '    <button class="btn small secondary" id="menu-refresh">Refresh</button>' +
        '  </div>' +
        '</div>' +
        '<div id="items-section"><div class="empty">Loading items…</div></div>' +
        '<div id="bundles-section" style="margin-top:24px;"><div class="empty">Loading bundles…</div></div>';

      $('#menu-refresh').addEventListener('click', loadMenu);
      await loadMenu();
    }

    async function loadMenu() {
      try {
        state.menu = await srv('ui_getMenu');
      } catch (err) {
        $('#items-section').innerHTML = '<div class="empty">Failed: ' + esc(err.message) + '</div>';
        return;
      }
      // ui_getMenu only returns active rows — we want all rows here. Re-fetch via
      // a workaround: pull inactive items by reading the sheet directly is not
      // exposed. For v1, only active rows are editable from this view; inactive
      // items must be reactivated from the sheet directly. Mark this limitation.
      if (state.view !== 'menu') return;
      renderItemsSection();
      renderBundlesSection();
    }

    function renderItemsSection() {
      var items = (state.menu && state.menu.items) || [];
      var html =
        '<div class="toolbar" style="margin-bottom:8px;">' +
        '  <h3 style="margin:0;">Items</h3>' +
        '  <button class="btn small" data-action="add-item">+ Add item</button>' +
        '</div>';
      if (items.length === 0) {
        html += '<div class="empty">No active items.</div>';
      } else {
        html += '<table>' +
          '<thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Category</th><th></th></tr></thead>' +
          '<tbody>' +
            items.map(function (i) {
              return (
                '<tr>' +
                '<td><span class="sub">' + esc(i.item_id) + '</span></td>' +
                '<td>' + esc(i.name) + '</td>' +
                '<td>' + fmtPeso(i.retail_price) + '</td>' +
                '<td>' + esc(i.category || '—') + '</td>' +
                '<td><button class="btn small secondary" data-action="edit-item" data-item-id="' + esc(i.item_id) + '">Edit</button></td>' +
                '</tr>'
              );
            }).join('') +
          '</tbody></table>';
      }
      $('#items-section').innerHTML = html;
      document.querySelector('[data-action="add-item"]').addEventListener('click', function () { openItemModal(null); });
      document.querySelectorAll('[data-action="edit-item"]').forEach(function (b) {
        b.addEventListener('click', function () { openItemModal(b.dataset.itemId); });
      });
    }

    function renderBundlesSection() {
      var bundles = (state.menu && state.menu.bundles) || [];
      var html =
        '<div class="toolbar" style="margin-bottom:8px;">' +
        '  <h3 style="margin:0;">Bundles</h3>' +
        '  <button class="btn small" data-action="add-bundle">+ Add bundle</button>' +
        '</div>';
      if (bundles.length === 0) {
        html += '<div class="empty">No active bundles.</div>';
      } else {
        html += '<table>' +
          '<thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Siopao qty</th><th>Gulaman qty</th><th></th></tr></thead>' +
          '<tbody>' +
            bundles.map(function (b) {
              return (
                '<tr>' +
                '<td><span class="sub">' + esc(b.bundle_id) + '</span></td>' +
                '<td>' + esc(b.name) + '</td>' +
                '<td>' + fmtPeso(b.price) + '</td>' +
                '<td>' + b.includes_siopao_qty + '</td>' +
                '<td>' + b.includes_gulaman_qty + '</td>' +
                '<td><button class="btn small secondary" data-action="edit-bundle" data-bundle-id="' + esc(b.bundle_id) + '">Edit</button></td>' +
                '</tr>'
              );
            }).join('') +
          '</tbody></table>';
      }
      $('#bundles-section').innerHTML = html;
      document.querySelector('[data-action="add-bundle"]').addEventListener('click', function () { openBundleModal(null); });
      document.querySelectorAll('[data-action="edit-bundle"]').forEach(function (b) {
        b.addEventListener('click', function () { openBundleModal(b.dataset.bundleId); });
      });
    }

    function openItemModal(item_id) {
      var existing = item_id ? (state.menu.items || []).filter(function (i) { return i.item_id === item_id; })[0] : null;
      var isNew = !existing;
      var modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML =
        '<div class="modal-card">' +
        '  <h3>' + (isNew ? 'Add item' : 'Edit item') + '</h3>' +
        '  <div class="row"><label>ID (slug)</label>' +
          (isNew
            ? '<input type="text" id="m-item-id" placeholder="e.g. asado" pattern="[a-z0-9_]+">'
            : '<div class="sub">' + esc(item_id) + ' <span class="sub">(immutable)</span></div>') +
        '  </div>' +
        '  <div class="row"><label>Name</label><input type="text" id="m-name" value="' + esc(existing ? existing.name : '') + '"></div>' +
        '  <div class="row"><label>Retail price (₱)</label><input type="number" id="m-price" min="0" step="0.01" value="' + (existing ? existing.retail_price : '') + '"></div>' +
        '  <div class="row"><label>Category</label><input type="text" id="m-cat" value="' + esc(existing ? existing.category : '') + '" placeholder="e.g. siopao, drink"></div>' +
        '  ' + (isNew ? '' : '<div class="row"><label>Active</label><label><input type="checkbox" id="m-active" checked> visible to sellers</label></div>') +
        '  <div class="modal-actions">' +
        '    <button class="btn secondary" data-modal-cancel>Cancel</button>' +
        '    <button class="btn" data-modal-ok>' + (isNew ? 'Add' : 'Save') + '</button>' +
        '  </div>' +
        '</div>';
      document.body.appendChild(modal);
      modal.querySelector('[data-modal-cancel]').addEventListener('click', function () { modal.remove(); });
      modal.querySelector('[data-modal-ok]').addEventListener('click', async function () {
        var btn = modal.querySelector('[data-modal-ok]');
        btn.disabled = true;
        try {
          if (isNew) {
            await srv('ui_addItem', {
              item_id:     modal.querySelector('#m-item-id').value.trim(),
              name:        modal.querySelector('#m-name').value.trim(),
              retail_price: Number(modal.querySelector('#m-price').value),
              category:    modal.querySelector('#m-cat').value.trim(),
              active:      true
            });
            toast('Item added', 'ok');
          } else {
            await srv('ui_updateItem', { item_id: item_id, fields: {
              name:         modal.querySelector('#m-name').value.trim(),
              retail_price: Number(modal.querySelector('#m-price').value),
              category:     modal.querySelector('#m-cat').value.trim(),
              active:       modal.querySelector('#m-active').checked
            }});
            toast('Item updated', 'ok');
          }
          modal.remove();
          state.menu = null;
          await loadMenu();
        } catch (err) {
          toast(err.message, 'err');
          btn.disabled = false;
        }
      });
    }

    // ---------- Sellers ----------
    async function renderSellers() {
      $('#content').innerHTML =
        '<div class="toolbar">' +
        '  <h2 class="section-title">Sellers</h2>' +
        '  <div class="controls">' +
        '    <button class="btn small secondary" id="sel-refresh">Refresh</button>' +
        '    <button class="btn small" id="sel-add">+ Add seller</button>' +
        '  </div>' +
        '</div>' +
        '<div id="sel-body"><div class="empty">Loading…</div></div>';

      // Ensure stores cache is populated for the Add modal's dropdown
      if (!state.stores) {
        try { state.stores = await srv('ui_listStores'); } catch (e) {}
      }

      $('#sel-refresh').addEventListener('click', loadSellers);
      $('#sel-add').addEventListener('click', function () { openSellerModal(null); });
      await loadSellers();
    }

    async function loadSellers() {
      try {
        state.sellers = await srv('ui_listSellers');
        if (state.view !== 'sellers') return;
        renderSellersTable();
      } catch (err) {
        $('#sel-body').innerHTML = '<div class="empty">Failed: ' + esc(err.message) + '</div>';
      }
    }

    function storeNameOf(store_id) {
      var s = (state.stores || []).filter(function (x) { return x.store_id === store_id; })[0];
      return s ? s.name : store_id;
    }

    function renderSellersTable() {
      var sellers = state.sellers || [];
      if (sellers.length === 0) {
        $('#sel-body').innerHTML = '<div class="empty">No sellers yet — click + Add seller.</div>';
        return;
      }
      var sorted = sellers.slice().sort(function (a, b) {
        if (a.active !== b.active) return a.active ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      $('#sel-body').innerHTML =
        '<table>' +
        '  <thead><tr><th>Name</th><th>Store</th><th>Last shift</th><th>Status</th><th></th></tr></thead>' +
        '  <tbody>' +
          sorted.map(function (s) {
            var statusBadge = s.active
              ? '<span class="badge ok">active</span>'
              : '<span class="badge warn">inactive</span>';
            var actions = [
              '<button class="btn small secondary" data-action="reset-pin" data-seller-id="' + esc(s.seller_id) + '" data-seller-name="' + esc(s.name) + '">Reset PIN</button>',
              s.active
                ? '<button class="btn small secondary" data-action="set-active" data-seller-id="' + esc(s.seller_id) + '" data-seller-name="' + esc(s.name) + '" data-active="false">Deactivate</button>'
                : '<button class="btn small secondary" data-action="set-active" data-seller-id="' + esc(s.seller_id) + '" data-seller-name="' + esc(s.name) + '" data-active="true">Reactivate</button>'
            ].join(' ');
            return (
              '<tr class="' + (s.active ? '' : 'row-inactive') + '">' +
              '<td>' + esc(s.name) + '</td>' +
              '<td>' + esc(storeNameOf(s.store_id)) + '</td>' +
              '<td>' + esc(fmtDate(s.last_shift_at)) + '</td>' +
              '<td>' + statusBadge + '</td>' +
              '<td style="white-space:nowrap;">' + actions + '</td>' +
              '</tr>'
            );
          }).join('') +
        '  </tbody></table>';

      document.querySelectorAll('[data-action="reset-pin"]').forEach(function (b) {
        b.addEventListener('click', function () { openResetPinModal(b.dataset.sellerId, b.dataset.sellerName); });
      });
      document.querySelectorAll('[data-action="set-active"]').forEach(function (b) {
        b.addEventListener('click', async function () {
          var active = b.dataset.active === 'true';
          var verb = active ? 'Reactivate' : 'Deactivate';
          if (!confirm(verb + ' ' + b.dataset.sellerName + '?')) return;
          b.disabled = true;
          try {
            await srv('ui_setSellerActive', { seller_id: b.dataset.sellerId, active: active });
            toast(verb + 'd', 'ok');
            await loadSellers();
          } catch (err) { toast(err.message, 'err'); b.disabled = false; }
        });
      });
    }

    function openSellerModal(seller_id) {
      var stores = (state.stores || []).filter(function (s) { return s.active; });
      var modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML =
        '<div class="modal-card">' +
        '  <h3>Add seller</h3>' +
        '  <div class="row"><label>Name</label><input type="text" id="m-name" placeholder="e.g. Lola Maria"></div>' +
        '  <div class="row"><label>Default store</label>' +
        '    <select id="m-store">' +
            stores.map(function (s) { return '<option value="' + esc(s.store_id) + '">' + esc(s.name) + '</option>'; }).join('') +
        '    </select>' +
        '  </div>' +
        '  <div class="row"><label>4-digit PIN</label><input type="text" id="m-pin" inputmode="numeric" maxlength="4" pattern="\\d{4}" placeholder="1234"></div>' +
        '  <div class="row"><span class="sub">PIN must be unique among active sellers at the chosen store.</span></div>' +
        '  <div class="modal-actions">' +
        '    <button class="btn secondary" data-modal-cancel>Cancel</button>' +
        '    <button class="btn" data-modal-ok>Add</button>' +
        '  </div>' +
        '</div>';
      document.body.appendChild(modal);
      modal.querySelector('[data-modal-cancel]').addEventListener('click', function () { modal.remove(); });
      modal.querySelector('[data-modal-ok]').addEventListener('click', async function () {
        var btn = modal.querySelector('[data-modal-ok]');
        var name  = modal.querySelector('#m-name').value.trim();
        var store = modal.querySelector('#m-store').value;
        var pin   = modal.querySelector('#m-pin').value.trim();
        if (!name) { toast('Name required', 'err'); return; }
        if (!/^\d{4}$/.test(pin)) { toast('PIN must be 4 digits', 'err'); return; }
        btn.disabled = true;
        try {
          await srv('ui_addSeller', { name: name, store_id: store, pin: pin });
          modal.remove();
          toast('Seller added', 'ok');
          await loadSellers();
        } catch (err) { toast(err.message, 'err'); btn.disabled = false; }
      });
      setTimeout(function () { modal.querySelector('#m-name').focus(); }, 0);
    }

    function openResetPinModal(seller_id, seller_name) {
      var modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML =
        '<div class="modal-card">' +
        '  <h3>Reset PIN</h3>' +
        '  <div class="row"><label>Seller</label><div>' + esc(seller_name) + '</div></div>' +
        '  <div class="row"><label>New 4-digit PIN</label><input type="text" id="m-pin" inputmode="numeric" maxlength="4" pattern="\\d{4}" placeholder="1234"></div>' +
        '  <div class="modal-actions">' +
        '    <button class="btn secondary" data-modal-cancel>Cancel</button>' +
        '    <button class="btn" data-modal-ok>Reset</button>' +
        '  </div>' +
        '</div>';
      document.body.appendChild(modal);
      modal.querySelector('[data-modal-cancel]').addEventListener('click', function () { modal.remove(); });
      modal.querySelector('[data-modal-ok]').addEventListener('click', async function () {
        var btn = modal.querySelector('[data-modal-ok]');
        var pin = modal.querySelector('#m-pin').value.trim();
        if (!/^\d{4}$/.test(pin)) { toast('PIN must be 4 digits', 'err'); return; }
        btn.disabled = true;
        try {
          await srv('ui_resetPin', { seller_id: seller_id, pin: pin });
          modal.remove();
          toast('PIN reset', 'ok');
        } catch (err) { toast(err.message, 'err'); btn.disabled = false; }
      });
      setTimeout(function () { modal.querySelector('#m-pin').focus(); }, 0);
    }

    function openBundleModal(bundle_id) {
      var existing = bundle_id ? (state.menu.bundles || []).filter(function (b) { return b.bundle_id === bundle_id; })[0] : null;
      var isNew = !existing;
      var modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML =
        '<div class="modal-card">' +
        '  <h3>' + (isNew ? 'Add bundle' : 'Edit bundle') + '</h3>' +
        '  <div class="row"><label>ID (slug)</label>' +
          (isNew
            ? '<input type="text" id="m-bundle-id" placeholder="e.g. combo" pattern="[a-z0-9_]+">'
            : '<div class="sub">' + esc(bundle_id) + ' <span class="sub">(immutable)</span></div>') +
        '  </div>' +
        '  <div class="row"><label>Name</label><input type="text" id="m-name" value="' + esc(existing ? existing.name : '') + '"></div>' +
        '  <div class="row"><label>Price (₱)</label><input type="number" id="m-price" min="0" step="0.01" value="' + (existing ? existing.price : '') + '"></div>' +
        '  <div class="row"><label>Siopao quantity included</label><input type="number" id="m-siopao" min="0" step="1" value="' + (existing ? existing.includes_siopao_qty : 0) + '"></div>' +
        '  <div class="row"><label>Gulaman quantity included</label><input type="number" id="m-gulaman" min="0" step="1" value="' + (existing ? existing.includes_gulaman_qty : 0) + '"></div>' +
        '  ' + (isNew ? '' : '<div class="row"><label>Active</label><label><input type="checkbox" id="m-active" checked> visible to sellers</label></div>') +
        '  <div class="modal-actions">' +
        '    <button class="btn secondary" data-modal-cancel>Cancel</button>' +
        '    <button class="btn" data-modal-ok>' + (isNew ? 'Add' : 'Save') + '</button>' +
        '  </div>' +
        '</div>';
      document.body.appendChild(modal);
      modal.querySelector('[data-modal-cancel]').addEventListener('click', function () { modal.remove(); });
      modal.querySelector('[data-modal-ok]').addEventListener('click', async function () {
        var btn = modal.querySelector('[data-modal-ok]');
        btn.disabled = true;
        try {
          if (isNew) {
            await srv('ui_addBundle', {
              bundle_id:            modal.querySelector('#m-bundle-id').value.trim(),
              name:                 modal.querySelector('#m-name').value.trim(),
              price:                Number(modal.querySelector('#m-price').value),
              includes_siopao_qty:  Number(modal.querySelector('#m-siopao').value),
              includes_gulaman_qty: Number(modal.querySelector('#m-gulaman').value),
              active:               true
            });
            toast('Bundle added', 'ok');
          } else {
            await srv('ui_updateBundle', { bundle_id: bundle_id, fields: {
              name:                 modal.querySelector('#m-name').value.trim(),
              price:                Number(modal.querySelector('#m-price').value),
              includes_siopao_qty:  Number(modal.querySelector('#m-siopao').value),
              includes_gulaman_qty: Number(modal.querySelector('#m-gulaman').value),
              active:               modal.querySelector('#m-active').checked
            }});
            toast('Bundle updated', 'ok');
          }
          modal.remove();
          state.menu = null;
          await loadMenu();
        } catch (err) {
          toast(err.message, 'err');
          btn.disabled = false;
        }
      });
    }

    // ---------- Boot ----------
    async function init() {
      try {
        var who = await srv('ui_whoami');

        if (!who.allowed) {
          $('#loading').hidden = true;
          $('#auth-gate').hidden = false;
          if (!who.email) {
            $('#auth-msg').innerHTML =
              'No Google identity detected. Make sure you are signed in to ' +
              'Google in this browser before opening this page.';
          } else if (!who.allowlist_configured) {
            $('#auth-msg').innerHTML =
              'You are signed in as <span class="email">' + esc(who.email) + '</span>, ' +
              'but <code>ADMIN_EMAILS</code> is empty in Script Properties.';
          } else {
            $('#auth-msg').innerHTML =
              'Signed in as <span class="email">' + esc(who.email) + '</span> ' +
              '— not in the admin allowlist.';
          }
          return;
        }

        $('#who-email').textContent = who.email;
        $('#loading').hidden = true;
        $('#app').hidden = false;

        // Wire tabs
        document.querySelectorAll('.tabs button').forEach(function (b) {
          b.addEventListener('click', function () { showView(b.dataset.view); });
        });

        // Land on dashboard by default
        showView('dashboard');
      } catch (err) {
        $('#loading').textContent = 'Failed to load: ' + (err.message || err);
      }
    }

    init();
  </script>
</body>
</html>
