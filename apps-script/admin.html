<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Siopao POS — Admin</title>
  <style>
    /* Reuse the seller-frontend palette as the de-facto Touchstone. */
    :root {
      --bg:        #fff8f0;
      --surface:   #ffffff;
      --surface-2: #fdf2e3;
      --primary:   #c44b2f;
      --primary-d: #9c3a23;
      --accent:    #2f7d3c;
      --warn:      #b88500;
      --danger:    #b3261e;
      --text:      #221a14;
      --muted:     #7a6a5e;
      --border:    #ead9c5;
      --shadow:    0 1px 3px rgba(80, 40, 10, 0.08);
      --radius:    10px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      font-size: 14px;
      line-height: 1.4;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input, select, textarea {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 6px;
      color: var(--text);
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; }

    [hidden] { display: none !important; }

    /* ---------- Loading / auth gate ---------- */
    .loading {
      display: flex; align-items: center; justify-content: center;
      min-height: 60vh; color: var(--muted); font-size: 16px;
    }
    .auth-gate {
      max-width: 480px; margin: 80px auto; text-align: center;
      background: var(--surface); padding: 32px 24px;
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .auth-gate h1 { margin: 0 0 12px; color: var(--primary); font-size: 24px; }
    .auth-gate p  { margin: 8px 0; }
    .auth-gate .email { font-weight: 600; }
    .auth-gate .hint  { color: var(--muted); font-size: 13px; margin-top: 16px; }
    #login-form { display: flex; flex-direction: column; gap: 12px; margin: 16px 0 4px; text-align: left; }
    #login-form .row { display: flex; flex-direction: column; gap: 4px; }
    #login-form .row label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    #login-form button { width: 100%; padding: 12px; }
    .login-err { margin: 0; height: 18px; color: var(--danger); font-size: 13px; text-align: left; }

    /* ---------- Topbar + nav ---------- */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .brand { font-weight: 700; color: var(--primary); font-size: 16px; }
    .who { color: var(--muted); font-size: 13px; }

    .tabs {
      display: flex; gap: 4px; padding: 0 12px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tabs button {
      padding: 12px 14px; font-weight: 500;
      color: var(--muted); border-bottom: 3px solid transparent;
      white-space: nowrap;
    }
    .tabs button.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .tabs button:hover:not(.active) { color: var(--text); }

    /* ---------- Content area ---------- */
    .content { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .view-stub {
      background: var(--surface); padding: 32px;
      border-radius: var(--radius); box-shadow: var(--shadow);
      color: var(--muted); text-align: center;
    }
    .view-stub h2 { color: var(--text); margin: 0 0 8px; }

    h2.section-title {
      margin: 0 0 12px; font-size: 18px;
    }

    /* ---------- Cards / tables (used by later heats) ---------- */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
    }
    table {
      width: 100%; border-collapse: collapse; background: var(--surface);
      border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow);
    }
    th, td {
      padding: 10px 12px; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: var(--surface-2);
      font-weight: 600; color: var(--muted);
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px;
    }
    tr:last-child td { border-bottom: none; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 14px; border-radius: 6px; font-weight: 600;
      background: var(--primary); color: white;
    }
    .btn:hover:not(:disabled) { background: var(--primary-d); }
    .btn.secondary {
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.danger { background: var(--danger); }
    .btn.small { padding: 6px 10px; font-size: 13px; }

    /* ---------- Modal (used by later heats) ---------- */
    .modal {
      position: fixed; inset: 0;
      background: rgba(20,10,5,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-card {
      background: var(--bg);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%; max-width: 420px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .modal-card h3 { margin: 0 0 12px; }
    .modal-card .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .modal-card .row label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

    /* ---------- Dashboard ---------- */
    .dash-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .dash-head .day { color: var(--muted); font-size: 13px; }
    .dash-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    @media (max-width: 720px) { .dash-grid { grid-template-columns: 1fr; } }
    .stat-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
    .stat-card h3 {
      margin: 0 0 8px; font-size: 12px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .stat-big { font-size: 30px; font-weight: 700; color: var(--primary); }
    .stat-row {
      display: flex; justify-content: space-between; padding: 6px 0;
      font-size: 14px;
    }
    .stat-row + .stat-row { border-top: 1px dashed var(--border); }
    .stat-row .label { color: var(--muted); }
    .stat-row .val { font-weight: 600; }
    .stat-store-block + .stat-store-block { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .stat-store-name {
      font-weight: 700; color: var(--text); margin-bottom: 6px; font-size: 14px;
    }

    .list-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
    .list-card h3 {
      margin: 0 0 12px; font-size: 14px; font-weight: 700;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .list-card h3 small { font-weight: 400; color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); font-style: italic; padding: 12px 0; }

    .row-line {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; gap: 8px;
    }
    .row-line + .row-line { border-top: 1px dashed var(--border); }
    .row-line .main { flex: 1; min-width: 0; }
    .row-line .sub { color: var(--muted); font-size: 12px; }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 700; text-transform: uppercase;
    }
    .badge.warn { background: #fff3cd; color: var(--warn); }
    .badge.danger { background: #fde0de; color: var(--danger); }
    .badge.ok { background: #e0f0e2; color: var(--accent); }

    /* ---------- Toolbars used by data views ---------- */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .toolbar .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .toolbar .controls label { color: var(--muted); font-size: 13px; }
    .toolbar .controls select, .toolbar .controls input {
      min-width: 140px;
    }

    .stock-cell { font-weight: 700; }
    .stock-cell.low { color: var(--warn); }
    .stock-cell.out { color: var(--danger); }
    .row-inactive { opacity: 0.55; }

    /* ---------- Filter bar ---------- */
    .filter-bar {
      background: var(--surface); padding: 12px 14px;
      border-radius: var(--radius); box-shadow: var(--shadow);
      margin-bottom: 14px;
      display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end;
    }
    .filter-bar .field { display: flex; flex-direction: column; gap: 4px; }
    .filter-bar .field label {
      font-size: 11px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    .filter-bar .actions { margin-left: auto; display: flex; gap: 8px; }

    .pill-group { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .pill-group button {
      padding: 7px 10px; font-size: 13px; background: var(--surface); color: var(--text);
    }
    .pill-group button.active { background: var(--primary); color: white; }

    .row-voided { background: #fdf6f5; }
    .row-voided .items, .row-voided .total { text-decoration: line-through; color: var(--muted); }

    .row-variance-bad { background: #fff7f6; }
    .var-good { color: var(--accent); font-weight: 600; }
    .var-bad  { color: var(--danger);  font-weight: 600; }
    td.cell-num { text-align: right; font-variant-numeric: tabular-nums; }

    .results-count { color: var(--muted); font-size: 13px; padding: 0 4px; }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: var(--text); color: white;
      padding: 10px 18px; border-radius: 999px; font-size: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      z-index: 200;
    }
    .toast.err { background: var(--danger); }
    .toast.ok  { background: var(--accent); }
  </style>
</head>
<body>

  <div id="loading" class="loading">Loading…</div>

  <div id="auth-gate" class="auth-gate" hidden>
    <h1>Siopao POS — Admin</h1>
    <p id="auth-msg" class="hint">&nbsp;</p>
    <form id="login-form" autocomplete="on">
      <div class="row">
        <label for="lg-user">Username</label>
        <input type="text" id="lg-user" autocomplete="username" required>
      </div>
      <div class="row">
        <label for="lg-pass">Password</label>
        <input type="password" id="lg-pass" autocomplete="current-password" required>
      </div>
      <p id="login-err" class="login-err">&nbsp;</p>
      <button class="btn" id="login-btn" type="submit">Log in</button>
    </form>
    <p class="hint">If you haven't set credentials yet, run <code>setupAdminPassword_dev</code> once in the Apps Script editor.</p>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">Siopao POS — Admin</div>
      <div class="who">
        <span id="who-email"></span>
        <button id="logout-btn" class="btn small secondary" style="margin-left:12px;">Log out</button>
      </div>
    </header>

    <nav class="tabs">
      <button data-view="dashboard">Dashboard</button>
      <button data-view="inventory">Inventory</button>
      <button data-view="menu">Menu &amp; Prices</button>
      <button data-view="sellers">Sellers</button>
      <button data-view="sales">Sales Log</button>
      <button data-view="shifts">Shift History</button>
    </nav>

    <main id="content" class="content"></main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script>
    'use strict';

    // ---------- Admin credentials ----------
    var AUTH_KEY = 'siopao.admin.auth';
    var adminAuth = loadAuth(); // { username, password } | null

    function loadAuth() {
      try {
        var raw = localStorage.getItem(AUTH_KEY);
        if (raw) {
          var v = JSON.parse(raw);
          if (v && v.username && v.password) return v;
        }
      } catch (e) {}
      return null;
    }
    function saveAuth(a) { localStorage.setItem(AUTH_KEY, JSON.stringify(a)); }
    function clearAuth() { localStorage.removeItem(AUTH_KEY); adminAuth = null; }

    // ---------- google.script.run promise wrapper ----------
    // Auto-injects adminAuth into the first param object so view code
    // doesn't have to thread credentials through every call. Pass _auth
    // explicitly only for the login call itself (where adminAuth is null
    // and we're submitting the user-typed form values).
    function srv(name) {
      var args = Array.prototype.slice.call(arguments, 1);
      if (adminAuth) {
        if (args.length === 0) {
          args.push({ _auth: adminAuth });
        } else if (args[0] && typeof args[0] === 'object' && !args[0]._auth) {
          args[0]._auth = adminAuth;
        }
      }
      return new Promise(function (resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (err) {
            reject(new Error((err && err.message) || String(err)));
          });
        runner[name].apply(runner, args);
      });
    }

    // ---------- Tiny helpers ----------
    function $(sel) { return document.querySelector(sel); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
      });
    }
    function fmtPeso(n, decimals) {
      if (decimals == null) decimals = 2;
      return '₱' + (Number(n) || 0).toFixed(decimals);
    }
    function toast(msg, kind) {
      var t = $('#toast');
      t.textContent = msg;
      t.className = 'toast' + (kind ? ' ' + kind : '');
      t.hidden = false;
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { t.hidden = true; }, 2800);
    }

    // ---------- State ----------
    var state = {
      view: null,
      menu: null,        // { stores, items, bundles }
      sellers: null,
      stores: null
    };

    // ---------- View router ----------
    var VIEWS = {
      dashboard: { title: 'Dashboard',     render: renderDashboard },
      inventory: { title: 'Inventory',     render: renderInventory },
      menu:      { title: 'Menu & Prices', render: renderMenu },
      sellers:   { title: 'Sellers',       render: renderSellers },
      sales:     { title: 'Sales Log',     render: renderSalesLog },
      shifts:    { title: 'Shift History', render: renderShiftHistory }
    };

    function showView(name) {
      var view = VIEWS[name];
      if (!view) return;
      state.view = name;
      document.querySelectorAll('.tabs button').forEach(function (b) {
        b.classList.toggle('active', b.dataset.view === name);
      });
      view.render(name);
    }

    function renderStub(name) {
      var v = VIEWS[name];
      $('#content').innerHTML =
        '<div class="view-stub">' +
        '  <h2>' + esc(v.title) + '</h2>' +
        '  <p>This view lands in a later heat. Auth + shell ready.</p>' +
        '</div>';
    }

    // ---------- Dashboard ----------
    async function renderDashboard() {
      $('#content').innerHTML =
        '<div class="dash-head">' +
        '  <h2 class="section-title">Today</h2>' +
        '  <button class="btn small secondary" id="dash-refresh">Refresh</button>' +
        '</div>' +
        '<div id="dash-body"><div class="empty">Loading…</div></div>';

      $('#dash-refresh').addEventListener('click', loadDashboard);
      await loadDashboard();
    }

    async function loadDashboard() {
      try {
        var data = await srv('ui_getDashboard');
        if (state.view !== 'dashboard') return; // tab switched mid-load
        $('#dash-body').innerHTML = buildDashboardHtml(data);
        wireDashboardActions();
      } catch (err) {
        $('#dash-body').innerHTML =
          '<div class="empty">Failed to load: ' + esc(err.message || err) + '</div>';
      }
    }

    function buildDashboardHtml(d) {
      var t = d.today || { by_store: {}, total: { cash: 0, gcash: 0, count: 0 } };
      var total = t.total || { cash: 0, gcash: 0, count: 0 };
      var revenue = (Number(total.cash) || 0) + (Number(total.gcash) || 0);

      var perStoreHtml = '';
      var storeKeys = Object.keys(t.by_store || {});
      if (storeKeys.length === 0) {
        perStoreHtml = '<div class="empty">No sales recorded today yet.</div>';
      } else {
        // Map store_id → display name via active_shifts / variance_alerts if any,
        // else fall back to the store_id itself.
        var storeNameLookup = {};
        (d.active_shifts || []).forEach(function (s) { storeNameLookup[s.store_id] = s.store_name; });
        (d.variance_alerts || []).forEach(function (s) { storeNameLookup[s.store_id] = s.store_name; });

        perStoreHtml = storeKeys.map(function (sid) {
          var row = t.by_store[sid];
          var name = storeNameLookup[sid] || sid;
          return (
            '<div class="stat-store-block">' +
            '  <div class="stat-store-name">' + esc(name) + '</div>' +
            '  <div class="stat-row"><span class="label">Cash</span><span class="val">' + fmtPeso(row.cash) + '</span></div>' +
            '  <div class="stat-row"><span class="label">GCash</span><span class="val">' + fmtPeso(row.gcash) + '</span></div>' +
            '  <div class="stat-row"><span class="label">Sales</span><span class="val">' + (row.count || 0) + '</span></div>' +
            '</div>'
          );
        }).join('');
      }

      var bestHtml = (!d.best_sellers || d.best_sellers.length === 0)
        ? '<div class="empty">Nothing sold today yet.</div>'
        : d.best_sellers.slice(0, 10).map(function (b) {
            return (
              '<div class="row-line">' +
              '  <div class="main">' + esc(b.name) + '</div>' +
              '  <div class="val">×' + b.qty_sold + '</div>' +
              '</div>'
            );
          }).join('');

      var activeHtml = (!d.active_shifts || d.active_shifts.length === 0)
        ? '<div class="empty">No active shifts right now.</div>'
        : d.active_shifts.map(function (s) {
            return (
              '<div class="row-line">' +
              '  <div class="main">' +
              '    <div>' + esc(s.seller_name) + ' <span class="sub">@ ' + esc(s.store_name) + '</span></div>' +
              '    <div class="sub">since ' + fmtTime(s.start_time) + ' · running ' + runningDuration(s.start_time) + '</div>' +
              '  </div>' +
              '  <button class="btn small secondary" data-action="force-close" data-shift-id="' + esc(s.shift_id) + '" data-seller="' + esc(s.seller_name) + '">Force close</button>' +
              '</div>'
            );
          }).join('');

      var alertsHtml = (!d.variance_alerts || d.variance_alerts.length === 0)
        ? '<div class="empty">No variance alerts today (threshold ₱20).</div>'
        : d.variance_alerts.map(function (a) {
            var bits = [];
            if (Math.abs(a.variance_cash)  > 0.005) bits.push('Cash ' + signed(a.variance_cash));
            if (Math.abs(a.variance_gcash) > 0.005) bits.push('GCash ' + signed(a.variance_gcash));
            return (
              '<div class="row-line">' +
              '  <div class="main">' +
              '    <div>' + esc(a.seller_name) + ' <span class="sub">@ ' + esc(a.store_name) + '</span></div>' +
              '    <div class="sub">closed ' + fmtTime(a.end_time) + '</div>' +
              '  </div>' +
              '  <span class="badge danger">' + bits.join(' · ') + '</span>' +
              '</div>'
            );
          }).join('');

      return (
        '<div class="dash-grid">' +
        '  <div class="stat-card">' +
        '    <h3>Revenue today</h3>' +
        '    <div class="stat-big">' + fmtPeso(revenue) + '</div>' +
        '    <div class="stat-row"><span class="label">Cash</span><span class="val">' + fmtPeso(total.cash) + '</span></div>' +
        '    <div class="stat-row"><span class="label">GCash</span><span class="val">' + fmtPeso(total.gcash) + '</span></div>' +
        '    <div class="stat-row"><span class="label">Sales</span><span class="val">' + (total.count || 0) + '</span></div>' +
        '  </div>' +
        '  <div class="stat-card">' +
        '    <h3>By store</h3>' +
        '    ' + perStoreHtml +
        '  </div>' +
        '  <div class="list-card">' +
        '    <h3>Best sellers <small>today</small></h3>' +
        '    ' + bestHtml +
        '  </div>' +
        '  <div class="list-card">' +
        '    <h3>Active shifts</h3>' +
        '    ' + activeHtml +
        '  </div>' +
        '  <div class="list-card" style="grid-column: 1 / -1;">' +
        '    <h3>Variance alerts <small>today, &gt; ₱20</small></h3>' +
        '    ' + alertsHtml +
        '  </div>' +
        '</div>'
      );
    }

    function wireDashboardActions() {
      document.querySelectorAll('[data-action="force-close"]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          var shiftId = btn.dataset.shiftId;
          var who = btn.dataset.seller;
          var ok = confirm('Force-close ' + who + "'s shift?\n\nNo counted cash/GCash will be recorded — variance fields will be blank. The shift's notes will be stamped [FORCE CLOSED BY ADMIN].");
          if (!ok) return;
          btn.disabled = true;
          try {
            await srv('ui_forceCloseShift', { shift_id: shiftId });
            toast('Shift force-closed', 'ok');
            await loadDashboard();
          } catch (err) {
            toast(err.message, 'err');
            btn.disabled = false;
          }
        });
      });
    }

    // ---------- Date/duration formatters ----------
    function fmtTime(t) {
      if (!t) return '—';
      var d = new Date(t);
      var h = d.getHours();
      var m = d.getMinutes();
      var ampm = h >= 12 ? 'PM' : 'AM';
      var hh = ((h + 11) % 12) + 1;
      return hh + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
    }
    function runningDuration(t) {
      if (!t) return '—';
      var ms = Date.now() - new Date(t).getTime();
      if (ms < 0) return '—';
      var m = Math.floor(ms / 60000);
      if (m < 60) return m + 'm';
      return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
    }
    function signed(n) {
      var v = Number(n) || 0;
      return (v > 0 ? '+' : '') + fmtPeso(v);
    }

    function fmtDate(t) {
      if (!t) return 'never';
      var d = new Date(t);
      var now = new Date();
      var sameDay = d.toDateString() === now.toDateString();
      if (sameDay) return 'today ' + fmtTime(t);
      var diffDays = Math.floor((now - d) / 86400000);
      if (diffDays === 1) return 'yesterday';
      if (diffDays < 7) return diffDays + 'd ago';
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }
    function pad2(n) { return (n < 10 ? '0' : '') + n; }

    // ---------- Inventory ----------
    var inventoryState = { store_id: null, rows: [] };

    async function renderInventory() {
      $('#content').innerHTML =
        '<div class="toolbar">' +
        '  <h2 class="section-title">Inventory</h2>' +
        '  <div class="controls">' +
        '    <label for="inv-store">Store</label>' +
        '    <select id="inv-store"></select>' +
        '    <button class="btn small secondary" id="inv-refresh">Refresh</button>' +
        '  </div>' +
        '</div>' +
        '<div id="inv-body"><div class="empty">Loading…</div></div>';

      // Load stores once, then default to first
      if (!state.stores) {
        try { state.stores = await srv('ui_listStores'); }
        catch (err) { $('#inv-body').innerHTML = '<div class="empty">Failed to load stores: ' + esc(err.message) + '</div>'; return; }
      }
      var sel = $('#inv-store');
      sel.innerHTML = state.stores
        .filter(function (s) { return s.active; })

    async function loadInventory() {
      var sid = inventoryState.store_id;
      if (!sid) return;
      $('#inv-body').innerHTML = '<div class="empty">Loading…</div>';
      try {
        inventoryState.rows = await srv('ui_getInventoryDetail', { store_id: sid });
        if (state.view !== 'inventory') return;
        renderInventoryTable();
      } catch (err) {
        $('#inv-body').innerHTML = '<div class="empty">Failed: ' + esc(err.message) + '</div>';
      }
    }

    function renderInventoryTable() {
      var rows = inventoryState.rows.slice().sort(function (a, b) {
        // active first, then by name
        if (a.active !== b.active) return a.active ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      if (rows.length === 0) {
        $('#inv-body').innerHTML = '<div class="empty">No items in inventory for this store.</div>';
        return;
      }
      $('#inv-body').innerHTML =
        '<table>' +
        '  <thead><tr><th>Item</th><th>Stock</th><th>Last restocked</th><th></th></tr></thead>' +
        '  <tbody>' +
          rows.map(function (r) {
            var stockClass = r.stock <= 0 ? 'out' : r.stock <= 5 ? 'low' : '';
            return (
              '<tr class="' + (r.active ? '' : 'row-inactive') + '">' +
              '  <td>' + esc(r.name) + (r.active ? '' : ' <span class="badge warn">inactive</span>') + '</td>' +
              '  <td class="stock-cell ' + stockClass + '">' + r.stock + '</td>' +
              '  <td>' + esc(fmtDate(r.last_restocked_at)) +
                  (r.last_restocked_qty ? ' <span class="sub">(+' + r.last_restocked_qty + ')</span>' : '') +
              '  </td>' +
              '  <td><button class="btn small" data-action="restock" data-item-id="' + esc(r.item_id) + '" data-item-name="' + esc(r.name) + '">+ Restock</button></td>' +
              '</tr>'
            );
          }).join('') +
        '  </tbody>' +
        '</table>';

      document.querySelectorAll('[data-action="restock"]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          openRestockModal(btn.dataset.itemId, btn.dataset.itemName);
        });
      });
    }

    function openRestockModal(item_id, item_name) {
      var storeName = (state.stores || []).filter(function (s) { return s.store_id === inventoryState.store_id; })[0];
      storeName = storeName ? storeName.name : inventoryState.store_id;
      var modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML =
        '<div class="modal-card">' +
        '  <h3>Restock</h3>' +
        '  <div class="row"><label>Item</label><div>' + esc(item_name) + ' <span class="sub">@ ' + esc(storeName) + '</span></div></div>' +
        '  <div class="row"><label>Quantity to add</label><input type="number" id="restock-qty" min="1" step="1" value="10" autofocus></div>' +
        '  <div class="row"><label>Notes (optional)</label><input type="text" id="restock-notes" placeholder="e.g. fresh batch from kitchen"></div>' +

        '    <button class="btn secondary" data-modal-cancel>Cancel</button>' +
        '    <button class="btn" data-modal-ok>Add stock</button>' +

        '</div>';

        var ok = modal.querySelector('[data-modal-ok]');

        if (!isFinite(qty) || qty <= 0) { toast('Quantity must be positive', 'err'); return; }

              active:       modal.querySelector('#m-active').checked

        '    <button class="btn small secondary" id="sel-refresh">Refresh</button>' +

        '  </div>' +

    async function loadSellers() {

        state.sellers = await srv('ui_listSellers');
        if (state.view !== 'sellers') return;
        renderSellersTable();

        $('#sel-body').innerHTML = '<div class="empty">Failed: ' + esc(err.message) + '</div>';

    function storeNameOf(store_id) {
      var s = (state.stores || []).filter(function (x) { return x.store_id === store_id; })[0];
      return s ? s.name : store_id;
    }

    function renderSellersTable() {
      var sellers = state.sellers || [];
      if (sellers.length === 0) {
        $('#sel-body').innerHTML = '<div class="empty">No sellers yet — click + Add seller.</div>';
        return;
      }
      var sorted = sellers.slice().sort(function (a, b) {
        if (a.active !== b.active) return a.active ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      $('#sel-body').innerHTML =
        '<table>' +
        '  <thead><tr><th>Name</th><th>Store</th><th>Last shift</th><th>Status</th><th></th></tr></thead>' +
        '  <tbody>' +
          sorted.map(function (s) {
            var statusBadge = s.active
              ? '<span class="badge ok">active</span>'
              : '<span class="badge warn">inactive</span>';
            var actions = [
              '<button class="btn small secondary" data-action="reset-pin" data-seller-id="' + esc(s.seller_id) + '" data-seller-name="' + esc(s.name) + '">Reset PIN</button>',

                : '<button class="btn small secondary" data-action="set-active" data-seller-id="' + esc(s.seller_id) + '" data-seller-name="' + esc(s.name) + '" data-active="true">Reactivate</button>'

        b.addEventListener('click', async function () {
          var active = b.dataset.active === 'true';
          var verb = active ? 'Reactivate' : 'Deactivate';
          if (!confirm(verb + ' ' + b.dataset.sellerName + '?')) return;
          b.disabled = true;

            await srv('ui_setSellerActive', { seller_id: b.dataset.sellerId, active: active });

    // ---------- Shared: date helpers for filters ----------
    function todayIso() {
      var d = new Date();
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }
    function isoToStart(s) { return s ? new Date(s + 'T00:00:00').toISOString() : ''; }
    function isoToEnd(s)   { return s ? new Date(s + 'T23:59:59').toISOString() : ''; }

    /** Build a filter bar with from/to dates, optional store/seller/payment/voided controls. */
    function renderFilterBar(opts) {
      var stores  = ((state.stores  || []).slice()).sort(function (a, b) { return a.name.localeCompare(b.name); });
      var sellers = ((state.sellers || []).slice()).sort(function (a, b) { return a.name.localeCompare(b.name); });
      var f = opts.values || {};
      var html =
        '<div class="filter-bar">' +
        '  <div class="field"><label>From</label><input type="date" id="f-from" value="' + esc(f.from || todayIso()) + '"></div>' +
        '  <div class="field"><label>To</label><input type="date" id="f-to" value="' + esc(f.to || todayIso()) + '"></div>';
      if (opts.includeStore) {
        html += '  <div class="field"><label>Store</label><select id="f-store"><option value="">All</option>' +
          stores.map(function (s) { return '<option value="' + esc(s.store_id) + '"' + (f.store_id === s.store_id ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') +
          '</select></div>';
      }
      if (opts.includeSeller) {
        html += '  <div class="field"><label>Seller</label><select id="f-seller"><option value="">All</option>' +
          sellers.map(function (s) { return '<option value="' + esc(s.seller_id) + '"' + (f.seller_id === s.seller_id ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') +
          '</select></div>';
      }
      if (opts.includePayment) {
        html += '  <div class="field"><label>Payment</label><div class="pill-group" id="f-pay">' +
          ['', 'cash', 'gcash'].map(function (v) {
            var label = v === '' ? 'All' : (v.charAt(0).toUpperCase() + v.slice(1));
            return '<button data-pay="' + esc(v) + '"' + (((f.payment_method || '') === v) ? ' class="active"' : '') + '>' + label + '</button>';
          }).join('') + '</div></div>';
      }
      if (opts.includeVoided) {
        html += '  <div class="field"><label>Voided</label><div class="pill-group" id="f-voided">' +
          [['', 'All'], ['false', 'No'], ['true', 'Yes']].map(function (pair) {
            var v = pair[0]; var label = pair[1];
            var current = f.voided == null ? '' : String(f.voided);
            return '<button data-voided="' + esc(v) + '"' + (current === v ? ' class="active"' : '') + '>' + label + '</button>';
          }).join('') + '</div></div>';
      }
      html +=
        '  <div class="actions">' +
        '    <button class="btn small secondary" id="f-apply">Apply</button>' +
        '  </div>' +
        '</div>';
      return html;
    }

    /** Read filter bar values into a params object suited for getSalesLog / getShiftHistory. */
    function readFilters(opts) {
      var out = {
        from: isoToStart(document.getElementById('f-from').value),
        to:   isoToEnd(document.getElementById('f-to').value)
      };
      if (opts.includeStore)   out.store_id  = document.getElementById('f-store').value || undefined;
      if (opts.includeSeller)  out.seller_id = document.getElementById('f-seller').value || undefined;
      if (opts.includePayment) {
        var pBtn = document.querySelector('#f-pay button.active');
        var pv = pBtn ? pBtn.dataset.pay : '';
        if (pv) out.payment_method = pv;
      }
      if (opts.includeVoided) {
        var vBtn = document.querySelector('#f-voided button.active');
        var vv = vBtn ? vBtn.dataset.voided : '';
        if (vv === 'true')  out.voided = true;
        if (vv === 'false') out.voided = false;
      }
      return out;
    }

    /** Wire pill-group buttons so clicking toggles the active state. */
    function wirePillGroup(id) {
      var group = document.getElementById(id);
      if (!group) return;
      group.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          group.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
        });
      });
    }

    async function ensureFilterCaches() {
      if (!state.menu)    state.menu    = await srv('ui_getMenu');
      if (!state.stores)  state.stores  = await srv('ui_listStores');
      if (!state.sellers) state.sellers = await srv('ui_listSellers');
    }

    function summarizeItems(json) {
      try {
        var items = JSON.parse(json || '[]');
        var nameMap = {};
        ((state.menu || {}).items   || []).forEach(function (i) { nameMap[i.item_id]   = i.name; });
        ((state.menu || {}).bundles || []).forEach(function (b) { nameMap[b.bundle_id] = b.name; });
        return items.map(function (l) {
          var base = (l.qty || 1) + '× ' + (nameMap[l.id] || l.id);
          if (l.type === 'bundle' && l.chosen_siopao) {
            base += ' (' + (nameMap[l.chosen_siopao] || l.chosen_siopao) + ')';
          }
          return base;
        }).join(', ');
      } catch (e) { return '—'; }
    }

    function fmtDateTime(t) {
      if (!t) return '—';
      var d = new Date(t);
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + fmtTime(t);
    }

    // ---------- Sales Log ----------
    var salesLogState = { rows: [] };

    async function renderSalesLog() {
      $('#content').innerHTML = '<div class="empty">Loading…</div>';
      await ensureFilterCaches();
      if (state.view !== 'sales') return;
      $('#content').innerHTML =
        '<h2 class="section-title">Sales Log</h2>' +
        renderFilterBar({ includeStore: true, includeSeller: true, includePayment: true, includeVoided: true }) +
        '<div id="sales-meta" class="results-count"></div>' +
        '<div id="sales-body"><div class="empty">Click Apply to load.</div></div>';

      wirePillGroup('f-pay');
      wirePillGroup('f-voided');
      $('#f-apply').addEventListener('click', loadSalesLog);
      await loadSalesLog();
    }

    async function loadSalesLog() {
      var f = readFilters({ includeStore: true, includeSeller: true, includePayment: true, includeVoided: true });
      $('#sales-body').innerHTML = '<div class="empty">Loading…</div>';
      try {
        salesLogState.rows = await srv('ui_getSalesLog', f);
        if (state.view !== 'sales') return;
        renderSalesTable();
      } catch (err) {
        $('#sales-body').innerHTML = '<div class="empty">Failed: ' + esc(err.message) + '</div>';
      }
    }

    function renderSalesTable() {
      var rows = salesLogState.rows;
      var totals = rows.reduce(function (acc, r) {
        if (!r.voided) {
          if (r.payment_method === 'cash')  acc.cash  += Number(r.subtotal) || 0;
          if (r.payment_method === 'gcash') acc.gcash += Number(r.subtotal) || 0;
          acc.count += 1;
        }
        return acc;
      }, { cash: 0, gcash: 0, count: 0 });

      $('#sales-meta').innerHTML =
        rows.length + ' rows · ' + totals.count + ' non-voided · ' +
        'Cash ' + fmtPeso(totals.cash) + ' · GCash ' + fmtPeso(totals.gcash);

      if (rows.length === 0) {
        $('#sales-body').innerHTML = '<div class="empty">No sales match these filters.</div>';
        return;
      }

      $('#sales-body').innerHTML =
        '<table>' +
        '  <thead><tr>' +
        '    <th>Time</th><th>Store</th><th>Seller</th><th>Items</th>' +
        '    <th class="cell-num">Total</th><th>Payment</th><th class="cell-num">Cash recv.</th><th class="cell-num">Change</th>' +
        '    <th></th>' +
        '  </tr></thead>' +
        '  <tbody>' +
          rows.map(function (r) {
            return (
              '<tr class="' + (r.voided ? 'row-voided' : '') + '">' +
              '<td>' + esc(fmtDateTime(r.timestamp)) + '</td>' +
              '<td>' + esc(r.store_name) + '</td>' +
              '<td>' + esc(r.seller_name) + '</td>' +
              '<td class="items">' + esc(summarizeItems(r.items_json)) + '</td>' +
              '<td class="cell-num total">' + fmtPeso(r.subtotal) + '</td>' +
              '<td>' + esc(r.payment_method) + (r.voided ? ' <span class="badge danger">voided</span>' : '') + '</td>' +
              '<td class="cell-num">' + (r.cash_received == null ? '—' : fmtPeso(r.cash_received)) + '</td>' +
              '<td class="cell-num">' + (r.change_given == null ? '—' : fmtPeso(r.change_given)) + '</td>' +
              '<td>' +
                (r.voided
                  ? '<span class="sub" title="' + esc(r.void_reason || '') + '\nby ' + esc(r.voided_by || '') + '">voided</span>'
                  : '<button class="btn small danger" data-action="void" data-sale-id="' + esc(r.sale_id) + '">Void</button>') +
              '</td>' +
              '</tr>'
            );
          }).join('') +
        '  </tbody></table>';

      document.querySelectorAll('[data-action="void"]').forEach(function (b) {
        b.addEventListener('click', function () { openVoidModal(b.dataset.saleId); });
      });
    }

    function openVoidModal(sale_id) {
      var modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML =
        '<div class="modal-card">' +
        '  <h3>Void sale</h3>' +
        '  <div class="row"><label>Reason (required)</label><input type="text" id="m-reason" placeholder="e.g. wrong order, customer returned"></div>' +
        '  <div class="row"><span class="sub">Inventory will be restored. The sale row stays for the audit trail. ' +
        '  If the shift was already closed, its stored totals are NOT rewritten — the void will be flagged on the shift detail instead.</span></div>' +
        '  <div class="modal-actions">' +
        '    <button class="btn secondary" data-modal-cancel>Cancel</button>' +
        '    <button class="btn danger" data-modal-ok>Void sale</button>' +
        '  </div>' +
        '</div>';
      document.body.appendChild(modal);
      modal.querySelector('[data-modal-cancel]').addEventListener('click', function () { modal.remove(); });
      modal.querySelector('[data-modal-ok]').addEventListener('click', async function () {
        var btn = modal.querySelector('[data-modal-ok]');
        var reason = modal.querySelector('#m-reason').value.trim();
        if (!reason) { toast('Reason required', 'err'); return; }
        btn.disabled = true;
        try {
          await srv('ui_voidSale', { sale_id: sale_id, reason: reason });
          modal.remove();
          toast('Sale voided', 'ok');
          await loadSalesLog();
        } catch (err) { toast(err.message, 'err'); btn.disabled = false; }
      });
      setTimeout(function () { modal.querySelector('#m-reason').focus(); }, 0);
    }

    // ---------- Shift History ----------
    var shiftHistoryState = { rows: [] };
    var VARIANCE_THRESHOLD = 20;

    async function renderShiftHistory() {
      $('#content').innerHTML = '<div class="empty">Loading…</div>';
      await ensureFilterCaches();
      if (state.view !== 'shifts') return;
      $('#content').innerHTML =
        '<h2 class="section-title">Shift History</h2>' +
        renderFilterBar({ includeStore: true, includeSeller: true }) +
        '<div id="shift-meta" class="results-count"></div>' +
        '<div id="shift-body"><div class="empty">Click Apply to load.</div></div>';

      $('#f-apply').addEventListener('click', loadShiftHistory);
      await loadShiftHistory();
    }

    async function loadShiftHistory() {
      var f = readFilters({ includeStore: true, includeSeller: true });
      $('#shift-body').innerHTML = '<div class="empty">Loading…</div>';
      try {
        shiftHistoryState.rows = await srv('ui_getShiftHistory', f);
        if (state.view !== 'shifts') return;
        renderShiftTable();
      } catch (err) {
        $('#shift-body').innerHTML = '<div class="empty">Failed: ' + esc(err.message) + '</div>';
      }
    }

    function varianceCell(v) {
      if (v == null) return '<span class="sub">—</span>';
      var cls = Math.abs(v) > VARIANCE_THRESHOLD ? 'var-bad' : (Math.abs(v) < 0.005 ? 'var-good' : '');
      return '<span class="' + cls + '">' + signed(v) + '</span>';
    }

    function renderShiftTable() {
      var rows = shiftHistoryState.rows;
      $('#shift-meta').innerHTML = rows.length + ' shifts';
      if (rows.length === 0) {
        $('#shift-body').innerHTML = '<div class="empty">No shifts match these filters.</div>';
        return;
      }

      $('#shift-body').innerHTML =
        '<table>' +
        '  <thead><tr>' +
        '    <th>Start</th><th>End</th><th>Store</th><th>Seller</th>' +
        '    <th class="cell-num">Expected cash</th><th class="cell-num">Counted</th><th class="cell-num">Δ</th>' +
        '    <th class="cell-num">Expected GCash</th><th class="cell-num">Counted</th><th class="cell-num">Δ</th>' +
        '    <th></th>' +
        '  </tr></thead>' +
        '  <tbody>' +
          rows.map(function (r) {
            var anyBad = (r.variance_cash != null && Math.abs(r.variance_cash) > VARIANCE_THRESHOLD)
                      || (r.variance_gcash != null && Math.abs(r.variance_gcash) > VARIANCE_THRESHOLD);
            var rowClass = anyBad ? 'row-variance-bad' : (r.end_time ? '' : 'row-inactive');
            var flags = '';
            if (!r.end_time) flags += ' <span class="badge ok">open</span>';
            if (r.post_close_voids > 0) flags += ' <span class="badge warn" title="' + r.post_close_voids + ' sale(s) voided after this shift was closed">' + r.post_close_voids + ' post-close void(s)</span>';
            return (
              '<tr class="' + rowClass + '">' +
              '<td>' + esc(fmtDateTime(r.start_time)) + '</td>' +
              '<td>' + esc(r.end_time ? fmtDateTime(r.end_time) : '—') + flags + '</td>' +
              '<td>' + esc(r.store_name) + '</td>' +
              '<td>' + esc(r.seller_name) + '</td>' +
              '<td class="cell-num">' + (r.expected_cash == null ? '—' : fmtPeso(r.expected_cash)) + '</td>' +
              '<td class="cell-num">' + (r.counted_cash  == null ? '—' : fmtPeso(r.counted_cash))  + '</td>' +
              '<td class="cell-num">' + varianceCell(r.variance_cash) + '</td>' +
              '<td class="cell-num">' + (r.expected_gcash == null ? '—' : fmtPeso(r.expected_gcash)) + '</td>' +
              '<td class="cell-num">' + (r.counted_gcash  == null ? '—' : fmtPeso(r.counted_gcash))  + '</td>' +
              '<td class="cell-num">' + varianceCell(r.variance_gcash) + '</td>' +
              '<td>' + (r.end_time
                  ? (r.notes ? '<span class="sub" title="' + esc(r.notes) + '">notes</span>' : '')
                  : '<button class="btn small secondary" data-action="force-close-from-history" data-shift-id="' + esc(r.shift_id) + '" data-seller="' + esc(r.seller_name) + '">Force close</button>') +
              '</td>' +
              '</tr>'
            );
          }).join('') +
        '  </tbody></table>';

      document.querySelectorAll('[data-action="force-close-from-history"]').forEach(function (b) {
        b.addEventListener('click', async function () {
          var ok = confirm('Force-close ' + b.dataset.seller + "'s shift?\n\nNo counted cash/GCash will be recorded.");
          if (!ok) return;
          b.disabled = true;
          try {
            await srv('ui_forceCloseShift', { shift_id: b.dataset.shiftId });
            toast('Shift force-closed', 'ok');
            await loadShiftHistory();
          } catch (err) { toast(err.message, 'err'); b.disabled = false; }
        });
      });
    }

    function openBundleModal(bundle_id) {
      var existing = bundle_id ? (state.menu.bundles || []).filter(function (b) { return b.bundle_id === bundle_id; })[0] : null;
      var isNew = !existing;
      var modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML =
        '<div class="modal-card">' +
        '  <h3>' + (isNew ? 'Add bundle' : 'Edit bundle') + '</h3>' +
        '  <div class="row"><label>ID (slug)</label>' +
          (isNew
            ? '<input type="text" id="m-bundle-id" placeholder="e.g. combo" pattern="[a-z0-9_]+">'
            : '<div class="sub">' + esc(bundle_id) + ' <span class="sub">(immutable)</span></div>') +
        '  </div>' +
        '  <div class="row"><label>Name</label><input type="text" id="m-name" value="' + esc(existing ? existing.name : '') + '"></div>' +
        '  <div class="row"><label>Price (₱)</label><input type="number" id="m-price" min="0" step="0.01" value="' + (existing ? existing.price : '') + '"></div>' +
        '  <div class="row"><label>Siopao quantity included</label><input type="number" id="m-siopao" min="0" step="1" value="' + (existing ? existing.includes_siopao_qty : 0) + '"></div>' +
        '  <div class="row"><label>Gulaman quantity included</label><input type="number" id="m-gulaman" min="0" step="1" value="' + (existing ? existing.includes_gulaman_qty : 0) + '"></div>' +
        '  ' + (isNew ? '' : '<div class="row"><label>Active</label><label><input type="checkbox" id="m-active"' + (existing.active ? ' checked' : '') + '> visible to sellers</label></div>') +
        '  <div class="modal-actions">' +
        '    <button class="btn secondary" data-modal-cancel>Cancel</button>' +
        '    <button class="btn" data-modal-ok>' + (isNew ? 'Add' : 'Save') + '</button>' +
        '  </div>' +
        '</div>';
      document.body.appendChild(modal);
      modal.querySelector('[data-modal-cancel]').addEventListener('click', function () { modal.remove(); });
      modal.querySelector('[data-modal-ok]').addEventListener('click', async function () {
        var btn = modal.querySelector('[data-modal-ok]');
        btn.disabled = true;
        try {
          if (isNew) {
            await srv('ui_addBundle', {
              bundle_id:            modal.querySelector('#m-bundle-id').value.trim(),
              name:                 modal.querySelector('#m-name').value.trim(),
              price:                Number(modal.querySelector('#m-price').value),
              includes_siopao_qty:  Number(modal.querySelector('#m-siopao').value),
              includes_gulaman_qty: Number(modal.querySelector('#m-gulaman').value),
              active:               true
            });
            toast('Bundle added', 'ok');
          } else {
            await srv('ui_updateBundle', { bundle_id: bundle_id, fields: {
              name:                 modal.querySelector('#m-name').value.trim(),
              price:                Number(modal.querySelector('#m-price').value),
              includes_siopao_qty:  Number(modal.querySelector('#m-siopao').value),
              includes_gulaman_qty: Number(modal.querySelector('#m-gulaman').value),
              active:               modal.querySelector('#m-active').checked
            }});
            toast('Bundle updated', 'ok');
          }
          modal.remove();
          state.menu = null;
          await loadMenu();
        } catch (err) {
          toast(err.message, 'err');
          btn.disabled = false;
        }
      });
    }

    // ---------- Boot ----------
    async function init() {
      // First decide: do we have stored creds? If so, verify them.
      // If not (or invalid), show the login form.
      try {
        var who = await srv('ui_whoami');
        $('#loading').hidden = true;

        if (!who.configured) {
          showLoginGate(
            'Admin credentials are not configured yet. Run ' +
            '<code>setupAdminPassword_dev</code> from the Apps Script editor first.',
            { disableForm: true }
          );
          return;
        }

        if (who.ok) {
          enterApp(who.username);
          return;
        }

        // We have stored creds but they were rejected → wipe them and show login.
        if (adminAuth) clearAuth();
        showLoginGate('');
      } catch (err) {
        $('#loading').textContent = 'Failed to load: ' + (err.message || err);
      }
    }

    function showLoginGate(msgHtml, opts) {
      opts = opts || {};
      $('#auth-gate').hidden = false;
      $('#auth-msg').innerHTML = msgHtml || '&nbsp;';
      if (opts.disableForm) {
        $('#lg-user').disabled = true;
        $('#lg-pass').disabled = true;
        $('#login-btn').disabled = true;
      }
      // Wire form submit (idempotent — addEventListener with no de-dupe
      // is fine because init runs at most once per page load).
      $('#login-form').addEventListener('submit', onLoginSubmit);
    }

    async function onLoginSubmit(e) {
      e.preventDefault();
      var user = $('#lg-user').value.trim();
      var pass = $('#lg-pass').value;
      if (!user || !pass) return;
      var btn = $('#login-btn');
      btn.disabled = true;
      $('#login-err').textContent = '';
      try {
        // Explicit _auth here because adminAuth is still null pre-login.
        var resp = await srv('ui_login', { _auth: { username: user, password: pass } });
        adminAuth = { username: user, password: pass };
        saveAuth(adminAuth);
        $('#auth-gate').hidden = true;
        enterApp(resp.username);
      } catch (err) {
        $('#login-err').textContent = err.message || 'Login failed';
        btn.disabled = false;
      }
    }

    function enterApp(username) {
      $('#who-email').textContent = username;
      $('#app').hidden = false;
      document.querySelectorAll('.tabs button').forEach(function (b) {
        b.addEventListener('click', function () { showView(b.dataset.view); });
      });
      $('#logout-btn').addEventListener('click', logout);
      showView('dashboard');
    }

    function logout() {
      clearAuth();
      // Wipe in-memory caches that could leak between sessions.
      state.menu = null;
      state.sellers = null;
      state.stores = null;
      $('#app').hidden = true;
      $('#content').innerHTML = '';
      $('#lg-pass').value = '';
      showLoginGate('Logged out.');
    }

    init();
  </script>
</body>
</html>
