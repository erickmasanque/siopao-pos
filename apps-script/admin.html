<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Siopao POS — Admin</title>
  <style>
    /* Reuse the seller-frontend palette as the de-facto Touchstone. */
    :root {
      --bg:        #fff8f0;
      --surface:   #ffffff;
      --surface-2: #fdf2e3;
      --primary:   #c44b2f;
      --primary-d: #9c3a23;
      --accent:    #2f7d3c;
      --warn:      #b88500;
      --danger:    #b3261e;
      --text:      #221a14;
      --muted:     #7a6a5e;
      --border:    #ead9c5;
      --shadow:    0 1px 3px rgba(80, 40, 10, 0.08);
      --radius:    10px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      font-size: 14px;
      line-height: 1.4;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input, select, textarea {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 6px;
      color: var(--text);
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; }

    [hidden] { display: none !important; }

    /* ---------- Loading / auth gate ---------- */
    .loading {
      display: flex; align-items: center; justify-content: center;
      min-height: 60vh; color: var(--muted); font-size: 16px;
    }
    .auth-gate {
      max-width: 480px; margin: 80px auto; text-align: center;
      background: var(--surface); padding: 32px 24px;
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .auth-gate h1 { margin: 0 0 12px; color: var(--primary); font-size: 24px; }
    .auth-gate p  { margin: 8px 0; }
    .auth-gate .email { font-weight: 600; }
    .auth-gate .hint  { color: var(--muted); font-size: 13px; margin-top: 16px; }

    /* ---------- Topbar + nav ---------- */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .brand { font-weight: 700; color: var(--primary); font-size: 16px; }
    .who { color: var(--muted); font-size: 13px; }

    .tabs {
      display: flex; gap: 4px; padding: 0 12px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tabs button {
      padding: 12px 14px; font-weight: 500;
      color: var(--muted); border-bottom: 3px solid transparent;
      white-space: nowrap;
    }
    .tabs button.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .tabs button:hover:not(.active) { color: var(--text); }

    /* ---------- Content area ---------- */
    .content { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .view-stub {
      background: var(--surface); padding: 32px;
      border-radius: var(--radius); box-shadow: var(--shadow);
      color: var(--muted); text-align: center;
    }
    .view-stub h2 { color: var(--text); margin: 0 0 8px; }

    h2.section-title {
      margin: 0 0 12px; font-size: 18px;
    }

    /* ---------- Cards / tables (used by later heats) ---------- */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
    }
    table {
      width: 100%; border-collapse: collapse; background: var(--surface);
      border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow);
    }
    th, td {
      padding: 10px 12px; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: var(--surface-2);
      font-weight: 600; color: var(--muted);
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px;
    }
    tr:last-child td { border-bottom: none; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 14px; border-radius: 6px; font-weight: 600;
      background: var(--primary); color: white;
    }
    .btn:hover:not(:disabled) { background: var(--primary-d); }
    .btn.secondary {
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.danger { background: var(--danger); }
    .btn.small { padding: 6px 10px; font-size: 13px; }

    /* ---------- Modal (used by later heats) ---------- */
    .modal {
      position: fixed; inset: 0;
      background: rgba(20,10,5,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-card {
      background: var(--bg);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%; max-width: 420px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .modal-card h3 { margin: 0 0 12px; }
    .modal-card .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .modal-card .row label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

    /* ---------- Dashboard ---------- */
    .dash-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .dash-head .day { color: var(--muted); font-size: 13px; }
    .dash-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    @media (max-width: 720px) { .dash-grid { grid-template-columns: 1fr; } }
    .stat-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
    .stat-card h3 {
      margin: 0 0 8px; font-size: 12px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .stat-big { font-size: 30px; font-weight: 700; color: var(--primary); }
    .stat-row {
      display: flex; justify-content: space-between; padding: 6px 0;
      font-size: 14px;
    }
    .stat-row + .stat-row { border-top: 1px dashed var(--border); }
    .stat-row .label { color: var(--muted); }
    .stat-row .val { font-weight: 600; }
    .stat-store-block + .stat-store-block { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .stat-store-name {
      font-weight: 700; color: var(--text); margin-bottom: 6px; font-size: 14px;
    }

    .list-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
    .list-card h3 {
      margin: 0 0 12px; font-size: 14px; font-weight: 700;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .list-card h3 small { font-weight: 400; color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); font-style: italic; padding: 12px 0; }

    .row-line {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; gap: 8px;
    }
    .row-line + .row-line { border-top: 1px dashed var(--border); }
    .row-line .main { flex: 1; min-width: 0; }
    .row-line .sub { color: var(--muted); font-size: 12px; }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 700; text-transform: uppercase;
    }
    .badge.warn { background: #fff3cd; color: var(--warn); }
    .badge.danger { background: #fde0de; color: var(--danger); }
    .badge.ok { background: #e0f0e2; color: var(--accent); }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: var(--text); color: white;
      padding: 10px 18px; border-radius: 999px; font-size: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      z-index: 200;
    }
    .toast.err { background: var(--danger); }
    .toast.ok  { background: var(--accent); }
  </style>
</head>
<body>

  <div id="loading" class="loading">Loading…</div>

  <div id="auth-gate" class="auth-gate" hidden>
    <h1>Siopao POS — Admin</h1>
    <p id="auth-msg">Not authorized.</p>
    <p class="hint">Open this page in a browser tab signed in to the Google account that owns this Apps Script project, and ensure that email is listed in <code>ADMIN_EMAILS</code> under Script Properties.</p>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">Siopao POS — Admin</div>
      <div class="who"><span id="who-email"></span></div>
    </header>

    <nav class="tabs">
      <button data-view="dashboard">Dashboard</button>
      <button data-view="inventory">Inventory</button>
      <button data-view="menu">Menu &amp; Prices</button>
      <button data-view="sellers">Sellers</button>
      <button data-view="sales">Sales Log</button>
      <button data-view="shifts">Shift History</button>
    </nav>

    <main id="content" class="content"></main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script>
    'use strict';

    // ---------- google.script.run promise wrapper ----------
    function srv(name) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (err) {
            reject(new Error((err && err.message) || String(err)));
          });
        runner[name].apply(runner, args);
      });
    }

    // ---------- Tiny helpers ----------
    function $(sel) { return document.querySelector(sel); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
      });
    }
    function fmtPeso(n, decimals) {
      if (decimals == null) decimals = 2;
      return '₱' + (Number(n) || 0).toFixed(decimals);
    }
    function toast(msg, kind) {
      var t = $('#toast');
      t.textContent = msg;
      t.className = 'toast' + (kind ? ' ' + kind : '');
      t.hidden = false;
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { t.hidden = true; }, 2800);
    }

    // ---------- State ----------
    var state = {
      view: null,
      menu: null,        // { stores, items, bundles }
      sellers: null,
      stores: null
    };

    // ---------- View router ----------
    var VIEWS = {
      dashboard: { title: 'Dashboard',     render: renderDashboard },
      inventory: { title: 'Inventory',     render: renderStub },
      menu:      { title: 'Menu & Prices', render: renderStub },
      sellers:   { title: 'Sellers',       render: renderStub },
      sales:     { title: 'Sales Log',     render: renderStub },
      shifts:    { title: 'Shift History', render: renderStub }
    };

    function showView(name) {
      var view = VIEWS[name];
      if (!view) return;
      state.view = name;
      document.querySelectorAll('.tabs button').forEach(function (b) {
        b.classList.toggle('active', b.dataset.view === name);
      });
      view.render(name);
    }

    function renderStub(name) {
      var v = VIEWS[name];
      $('#content').innerHTML =
        '<div class="view-stub">' +
        '  <h2>' + esc(v.title) + '</h2>' +
        '  <p>This view lands in a later heat. Auth + shell ready.</p>' +
        '</div>';
    }

    // ---------- Dashboard ----------
    async function renderDashboard() {
      $('#content').innerHTML =
        '<div class="dash-head">' +
        '  <h2 class="section-title">Today</h2>' +
        '  <button class="btn small secondary" id="dash-refresh">Refresh</button>' +
        '</div>' +
        '<div id="dash-body"><div class="empty">Loading…</div></div>';

      $('#dash-refresh').addEventListener('click', loadDashboard);
      await loadDashboard();
    }

    async function loadDashboard() {
      try {
        var data = await srv('ui_getDashboard');
        if (state.view !== 'dashboard') return; // tab switched mid-load
        $('#dash-body').innerHTML = buildDashboardHtml(data);
        wireDashboardActions();
      } catch (err) {
        $('#dash-body').innerHTML =
          '<div class="empty">Failed to load: ' + esc(err.message || err) + '</div>';
      }
    }

    function buildDashboardHtml(d) {
      var t = d.today || { by_store: {}, total: { cash: 0, gcash: 0, count: 0 } };
      var total = t.total || { cash: 0, gcash: 0, count: 0 };
      var revenue = (Number(total.cash) || 0) + (Number(total.gcash) || 0);

      var perStoreHtml = '';
      var storeKeys = Object.keys(t.by_store || {});
      if (storeKeys.length === 0) {
        perStoreHtml = '<div class="empty">No sales recorded today yet.</div>';
      } else {
        // Map store_id → display name via active_shifts / variance_alerts if any,
        // else fall back to the store_id itself.
        var storeNameLookup = {};
        (d.active_shifts || []).forEach(function (s) { storeNameLookup[s.store_id] = s.store_name; });
        (d.variance_alerts || []).forEach(function (s) { storeNameLookup[s.store_id] = s.store_name; });

        perStoreHtml = storeKeys.map(function (sid) {
          var row = t.by_store[sid];
          var name = storeNameLookup[sid] || sid;
          return (
            '<div class="stat-store-block">' +
            '  <div class="stat-store-name">' + esc(name) + '</div>' +
            '  <div class="stat-row"><span class="label">Cash</span><span class="val">' + fmtPeso(row.cash) + '</span></div>' +
            '  <div class="stat-row"><span class="label">GCash</span><span class="val">' + fmtPeso(row.gcash) + '</span></div>' +
            '  <div class="stat-row"><span class="label">Sales</span><span class="val">' + (row.count || 0) + '</span></div>' +
            '</div>'
          );
        }).join('');
      }

      var bestHtml = (!d.best_sellers || d.best_sellers.length === 0)
        ? '<div class="empty">Nothing sold today yet.</div>'
        : d.best_sellers.slice(0, 10).map(function (b) {
            return (
              '<div class="row-line">' +
              '  <div class="main">' + esc(b.name) + '</div>' +
              '  <div class="val">×' + b.qty_sold + '</div>' +
              '</div>'
            );
          }).join('');

      var activeHtml = (!d.active_shifts || d.active_shifts.length === 0)
        ? '<div class="empty">No active shifts right now.</div>'
        : d.active_shifts.map(function (s) {
            return (
              '<div class="row-line">' +
              '  <div class="main">' +
              '    <div>' + esc(s.seller_name) + ' <span class="sub">@ ' + esc(s.store_name) + '</span></div>' +
              '    <div class="sub">since ' + fmtTime(s.start_time) + ' · running ' + runningDuration(s.start_time) + '</div>' +
              '  </div>' +
              '  <button class="btn small secondary" data-action="force-close" data-shift-id="' + esc(s.shift_id) + '" data-seller="' + esc(s.seller_name) + '">Force close</button>' +
              '</div>'
            );
          }).join('');

      var alertsHtml = (!d.variance_alerts || d.variance_alerts.length === 0)
        ? '<div class="empty">No variance alerts today (threshold ₱20).</div>'
        : d.variance_alerts.map(function (a) {
            var bits = [];
            if (Math.abs(a.variance_cash)  > 0.005) bits.push('Cash ' + signed(a.variance_cash));
            if (Math.abs(a.variance_gcash) > 0.005) bits.push('GCash ' + signed(a.variance_gcash));
            return (
              '<div class="row-line">' +
              '  <div class="main">' +
              '    <div>' + esc(a.seller_name) + ' <span class="sub">@ ' + esc(a.store_name) + '</span></div>' +
              '    <div class="sub">closed ' + fmtTime(a.end_time) + '</div>' +
              '  </div>' +
              '  <span class="badge danger">' + bits.join(' · ') + '</span>' +
              '</div>'
            );
          }).join('');

      return (
        '<div class="dash-grid">' +
        '  <div class="stat-card">' +
        '    <h3>Revenue today</h3>' +
        '    <div class="stat-big">' + fmtPeso(revenue) + '</div>' +
        '    <div class="stat-row"><span class="label">Cash</span><span class="val">' + fmtPeso(total.cash) + '</span></div>' +
        '    <div class="stat-row"><span class="label">GCash</span><span class="val">' + fmtPeso(total.gcash) + '</span></div>' +
        '    <div class="stat-row"><span class="label">Sales</span><span class="val">' + (total.count || 0) + '</span></div>' +
        '  </div>' +
        '  <div class="stat-card">' +
        '    <h3>By store</h3>' +
        '    ' + perStoreHtml +
        '  </div>' +
        '  <div class="list-card">' +
        '    <h3>Best sellers <small>today</small></h3>' +
        '    ' + bestHtml +
        '  </div>' +
        '  <div class="list-card">' +
        '    <h3>Active shifts</h3>' +
        '    ' + activeHtml +
        '  </div>' +
        '  <div class="list-card" style="grid-column: 1 / -1;">' +
        '    <h3>Variance alerts <small>today, &gt; ₱20</small></h3>' +
        '    ' + alertsHtml +
        '  </div>' +
        '</div>'
      );
    }

    function wireDashboardActions() {
      document.querySelectorAll('[data-action="force-close"]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          var shiftId = btn.dataset.shiftId;
          var who = btn.dataset.seller;
          var ok = confirm('Force-close ' + who + "'s shift?\n\nNo counted cash/GCash will be recorded — variance fields will be blank. The shift's notes will be stamped [FORCE CLOSED BY ADMIN].");
          if (!ok) return;
          btn.disabled = true;
          try {
            await srv('ui_forceCloseShift', { shift_id: shiftId });
            toast('Shift force-closed', 'ok');
            await loadDashboard();
          } catch (err) {
            toast(err.message, 'err');
            btn.disabled = false;
          }
        });
      });
    }

    // ---------- Date/duration formatters ----------
    function fmtTime(t) {
      if (!t) return '—';
      var d = new Date(t);
      var h = d.getHours();
      var m = d.getMinutes();
      var ampm = h >= 12 ? 'PM' : 'AM';
      var hh = ((h + 11) % 12) + 1;
      return hh + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
    }
    function runningDuration(t) {
      if (!t) return '—';
      var ms = Date.now() - new Date(t).getTime();
      if (ms < 0) return '—';
      var m = Math.floor(ms / 60000);
      if (m < 60) return m + 'm';
      return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
    }
    function signed(n) {
      var v = Number(n) || 0;
      return (v > 0 ? '+' : '') + fmtPeso(v);
    }

    // ---------- Boot ----------
    async function init() {
      try {
        var who = await srv('ui_whoami');

        if (!who.allowed) {
          $('#loading').hidden = true;
          $('#auth-gate').hidden = false;
          if (!who.email) {
            $('#auth-msg').innerHTML =
              'No Google identity detected. Make sure you are signed in to ' +
              'Google in this browser before opening this page.';
          } else if (!who.allowlist_configured) {
            $('#auth-msg').innerHTML =
              'You are signed in as <span class="email">' + esc(who.email) + '</span>, ' +
              'but <code>ADMIN_EMAILS</code> is empty in Script Properties.';
          } else {
            $('#auth-msg').innerHTML =
              'Signed in as <span class="email">' + esc(who.email) + '</span> ' +
              '— not in the admin allowlist.';
          }
          return;
        }

        $('#who-email').textContent = who.email;
        $('#loading').hidden = true;
        $('#app').hidden = false;

        // Wire tabs
        document.querySelectorAll('.tabs button').forEach(function (b) {
          b.addEventListener('click', function () { showView(b.dataset.view); });
        });

        // Land on dashboard by default
        showView('dashboard');
      } catch (err) {
        $('#loading').textContent = 'Failed to load: ' + (err.message || err);
      }
    }

    init();
  </script>
</body>
</html>
